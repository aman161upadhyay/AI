id: research-agent-001
agent: research-agent
title: Choose a bounded research architecture
task: >
  Recommend an initial architecture for an internal engineering research assistant.
  Compare one researcher with parallel workers. Return a 400-word decision memo,
  evidence limits, a bounded experiment, and reversal conditions.
inputs: |
  Evaluation scenario, not Aman's actual budget: monthly cap USD 50.
  Private Drive/Notion access is selected-collection read-only. No external writes.
  Runtime evidence packet, network disabled:
  S1 Anthropic reports an orchestrator-worker design with a separate CitationAgent
  and about 15 times ordinary-chat token use in its own system.
  URL: https://www.anthropic.com/engineering/multi-agent-research-system
  S2 LangChain has clarification, brief, supervisor, researcher compression, and writing.
  URL: https://github.com/langchain-ai/open_deep_research
  S3 No workload traces, current prices, query volume, or private-data export approval
  have been supplied. You may use only this packet. Do not make paid calls.
gold: |
  A defensible initial choice is one lead, a durable evidence ledger, and a separate
  citation pass, with conditional bounded workers for independent questions.
  Alternatives are acceptable if cost uncertainty and permissions remain explicit.
  USD 50 cannot establish a run count without current prices and workload volume.
rubric:
  - criterion: decision fit
    weight: 30
    pass_if: Compares architectures against workload and cap without invented dollar estimates.
  - criterion: evidence discrimination
    weight: 30
    pass_if: Attributes Anthropic results to its own system and does not claim universal superiority.
  - criterion: verification and privacy
    weight: 25
    pass_if: Reserves citation review and keeps private reads separate from external writes.
  - criterion: reversible experiment
    weight: 15
    pass_if: Proposes a matched-budget trial and observable reversal condition.
judge: human
anti_patterns:
  - Recommends many workers solely because a vendor reports gains.
  - Invents prices or a supported monthly run count.
  - Treats read access as permission to export private data.
source: "work/research/03-research-agent.md, R1; Anthropic multi-agent article and LangChain repository."
as_of: "2026-10-25"